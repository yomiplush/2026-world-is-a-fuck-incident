<script>
(function() {
    // 1. Get current path
    var path = window.location.pathname;

    // 2. Define the regex
    // EXPLANATION:
    // \/s\/               -> Looks for "/s/"
    // (?:case|detail)     -> Looks for EITHER "case" OR "detail"
    // \/                  -> Followed by a slash
    // (500[a-zA-Z0-9]*)   -> Capture the ID starting with 500
    // (?=\/|$)            -> Stop capturing at the next slash or end of URL
    var regex = /\/s\/(?:case|detail)\/(500[a-zA-Z0-9]*)(?=\/|$)/;
    
    var match = path.match(regex);

    // 3. Execute ONLY if we found a valid Case ID pattern
    if (match && match[1]) {
        var caseId = match[1];

        // Stop the browser from loading the rest of the page (prevents 404/Access Error flicker)
        if (window.stop) {
            window.stop();
        } else {
            document.execCommand("Stop"); // IE Fallback
        }

        // 4. Construct new URL and Redirect
        var newUrl = window.location.origin + '/s/mycase?recordId=' + caseId;
        window.location.replace(newUrl);
    }
})();
</script>

<script>
    var resetChat = false; 
    
    window.addEventListener("onEmbeddedMessagingReady" , function(event){
        let userId = $A.get('$SObjectType.CurrentUser.Id');
        console.log('User Id: ' + userId);
        embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
            'User_Id' : (userId == undefined) ? '' : userId
        });
        
        window.addEventListener("onEmbeddedMessagingConversationOpened" , function(event){
            //console.log('---Inside onEmbeddedMessagingConversationOpened---' +resetChat + '  '+userId);
            //Guest & Log In user switch
            if(userId == undefined){
                if(localStorage.getItem('guestUser') == 'false'){
                    resetChat = true;
                }
                localStorage.setItem('guestUser', 'true');
            }
            else if(userId != undefined) {
                if(localStorage.getItem('guestUser') == 'true'){
                    resetChat = true;
                }
                localStorage.setItem('guestUser', 'false');
            }
            
            if(resetChat == true){
               resetChat = false;
                 embeddedservice_bootstrap.userVerificationAPI.clearSession(true).then(() => {
                    //console.log('---Session Cleared---');
                    //Restart chat
                    embeddedservice_bootstrap.utilAPI.launchChat().then(function (success) {
                        //console.log('---Session Refreshed---');
                    })
                })
              .catch((error) => {
                console.error(error);
              });
            }
    	});
        window.addEventListener("onEmbeddedMessagingConversationClosed" , function(event){
            //console.log('---Inside onEmbeddedMessagingConversationClosed---');
            localStorage.removeItem('guestUser');
        });
    });
