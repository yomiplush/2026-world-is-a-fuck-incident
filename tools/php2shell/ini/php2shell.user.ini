; php2shell.user.ini — per-directory stopgap for shared hosting / no root access.
;
; Drop as `.user.ini` in the document root (PHP_INI_PERDIR applies to
; session.upload_progress.* and session.use_strict_mode). Takes effect within
; user_ini.cache_ttl (default 300s), no restart needed. Only works when the SAPI
; honours .user.ini (php-fpm / mod_php with user_ini.filename set), and never
; overrides an admin-level php.ini value that already forces the setting.
;
; If .user.ini is disabled, use .htaccess instead:
;   php_value session.upload_progress.enabled 0
;   php_flag  session.use_strict_mode On

session.upload_progress.enabled = 0
session.upload_progress.cleanup = 1
session.use_strict_mode = 1
