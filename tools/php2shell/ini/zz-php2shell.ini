; zz-php2shell.ini — interim mitigation for php2shell (CVE-2026-109618 / CVE-2026-109619)
;
; Loaded last (zz- prefix) so it wins over php.ini and image defaults.
; Deploy to: /usr/local/etc/php/conf.d/ (docker php images) or
;            /etc/php/<ver>/{fpm,cli}/conf.d/ (distro packages), then reload PHP.
;
; What this does
;   session.upload_progress.enabled=0  removes the code path the leaked exploit
;                                      drives (the multipart upload-progress
;                                      bookkeeping in PHP's session module).
;                                      Costs nothing except upload progress bars.
;   session.use_strict_mode=1          rejects session IDs PHP never issued, so a
;                                      forged/replayed ID cannot be adopted.
;   expose_php=Off                     stops advertising the PHP version in
;                                      X-Powered-By (scanner triage help).
;
; This is a stopgap, NOT the fix. Apply the upstream PHP release when it lands and
; then remove or narrow this file — see docs/runbook.md.

session.upload_progress.enabled = 0
session.upload_progress.cleanup = 1
session.use_strict_mode = 1
expose_php = Off
