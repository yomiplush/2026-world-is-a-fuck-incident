# Managed by php2shell-defense (p2s).
#
# Restores the real client IP for traffic arriving through a Cloudflare tunnel.
# cloudflared runs inside a Docker bridge network and terminates the client
# connection, so nginx otherwise records every request as the bridge address.
# That blinds logs, fail2ban and incident triage: a scanner and a browser become
# indistinguishable. Cloudflare always sets CF-Connecting-IP on tunnel traffic,
# so trust that header — but only from the tunnel network.
#
# REPLACE the subnet below with the one cloudflared actually runs in:
#   docker inspect cloudflared --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}/{{end}}'
#   # or: docker network inspect <network> --format '{{.IPAM.Config}}'
# Trusting a wider range than necessary defeats the purpose.
set_real_ip_from 172.20.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Do not advertise the nginx version in error pages / Server headers.
server_tokens off;
